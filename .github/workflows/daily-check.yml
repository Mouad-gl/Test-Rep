name: Daily Code Quality Check

on:
  schedule:
    - cron: '0 8 * * *'   # runs every day at 08:00 UTC
  workflow_dispatch:        # allow manual trigger from GitHub Actions tab

jobs:
  quality:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/ticket-generator-interactive-APwX3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check bundle size
        run: |
          BUILD_SIZE=$(du -sh dist/ | cut -f1)
          echo "Bundle size: $BUILD_SIZE"
          SIZE_KB=$(du -sk dist/ | cut -f1)
          if [ "$SIZE_KB" -gt 10240 ]; then
            echo "::warning::Bundle is larger than 10MB ($BUILD_SIZE). Consider code splitting."
          fi
